<style>
:root{
  --olive-dark:#484D31; --near-black:#282823; --gray:#ACACAC; --bg:#F8F8F8;
  --olive-mid:#5F6844; --sage:#A4AC8C; --white:#FFFFFF;
  --radius:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'DM Sans', sans-serif; background:var(--bg); color:var(--near-black);
  min-height:100vh; display:flex; flex-direction:column;
}
.app{max-width:720px; margin:0 auto; width:100%; padding:32px 24px 60px; flex:1; display:flex; flex-direction:column;}
.eyebrow{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--olive-mid); font-weight:500; margin-bottom:10px;}
h1{font-family:'Outfit',sans-serif; font-weight:600; font-size:28px; line-height:1.25; color:var(--near-black); margin-bottom:8px;}
.sub{font-size:15px; color:#5b5b56; margin-bottom:28px; line-height:1.5;}
.progress{display:flex; gap:6px; margin-bottom:36px;}
.progress span{height:3px; flex:1; background:#e2e0d8; border-radius:2px; overflow:hidden;}
.progress span i{display:block; height:100%; width:0; background:var(--olive-dark); transition:width .3s;}
.progress span.done i{width:100%;}
.options{display:flex; flex-direction:column; gap:12px;}
.opt{
  text-align:left; border:1px solid #e2e0d8; background:var(--white); border-radius:var(--radius);
  padding:18px 20px; font-size:16px; font-family:'DM Sans',sans-serif; color:var(--near-black);
  cursor:pointer; transition:.15s; line-height:1.4;
}
.opt:hover{border-color:var(--olive-mid); background:#fbfaf7;}
.opt:active{transform:scale(.99);}
.opt.selected{border-color:var(--olive-dark); background:var(--sage); background:rgba(164,172,140,.18);}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:520px){.opt-grid{grid-template-columns:1fr;}}
textarea, input[type=text]{
  width:100%; border:1px solid #e2e0d8; border-radius:12px; padding:14px 16px; font-size:15px;
  font-family:'DM Sans',sans-serif; resize:vertical; min-height:90px;
}
.nav{display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:28px;}
.btn{
  border:none; border-radius:999px; padding:13px 26px; font-size:15px; font-weight:500;
  font-family:'DM Sans',sans-serif; cursor:pointer; transition:.15s;
}
.btn-primary{background:var(--olive-dark); color:var(--white);}
.btn-primary:hover{background:var(--near-black);}
.btn-primary:disabled{background:#d3d1c7; cursor:not-allowed;}
.btn-text{background:none; color:#5b5b56; padding:13px 8px;}
.btn-text:hover{color:var(--near-black);}
.loading{display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:18px; text-align:center;}
.spinner{width:36px; height:36px; border:3px solid #e2e0d8; border-top-color:var(--olive-dark); border-radius:50%; animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.card{
  border:1px solid #e2e0d8; border-radius:var(--radius); padding:22px; margin-bottom:16px; background:var(--white);
}
.card .torre-tag{display:inline-block; font-size:12px; font-weight:500; color:var(--olive-mid); background:rgba(164,172,140,.25); padding:4px 10px; border-radius:999px; margin-bottom:10px;}
.card h3{font-family:'Outfit',sans-serif; font-size:20px; margin-bottom:6px;}
.card .specs{font-size:14px; color:#5b5b56; margin-bottom:10px;}
.card .precio{font-family:'Outfit',sans-serif; font-size:22px; font-weight:600; color:var(--olive-dark); margin-bottom:10px;}
.card .justif{font-size:14px; line-height:1.55; color:var(--near-black);}
.positioning{background:rgba(72,77,49,.06); border-radius:12px; padding:16px 18px; font-size:14px; line-height:1.5; margin:20px 0;}
.advisor-note{border-left:3px solid var(--olive-mid); padding:12px 16px; font-size:13px; color:#5b5b56; margin-top:20px; background:#fbfaf7; border-radius:0 12px 12px 0;}
.advisor-note b{color:var(--near-black);}
.honest-msg{background:#fbfaf7; border:1px solid var(--sage); border-radius:12px; padding:18px; font-size:15px; line-height:1.55; margin-bottom:20px;}
.bifurcacion{display:flex; gap:12px; margin-top:24px;}
.bifurcacion a{flex:1; text-align:center; text-decoration:none; padding:15px; border-radius:12px; font-weight:500; font-size:15px;}
.bif-invest{background:var(--olive-dark); color:#fff;}
.bif-live{background:var(--white); border:1px solid var(--olive-dark); color:var(--olive-dark);}
</style>

function normName(s){ return (s||'').toString().replace(/[\s\-\(\)']+/g,'').toUpperCase(); }

function parseCSV(text){
  return text.trim().split('\n').map(line=>{
    const vals=[]; let cur='', inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){inQ=!inQ;}
      else if(c===',' && !inQ){vals.push(cur); cur='';}
      else{cur+=c;}
    }
    vals.push(cur);
    return vals;
  });
}

async function fetchMappenTorre(torre){
  const url = `https://docs.google.com/spreadsheets/d/${MAPPEN_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Torre%20${torre}`;
  const res = await fetch(url);
  const text = await res.text();
  const rows = parseCSV(text);
  const out = [];
  for(const r of rows.slice(1)){
    const nombre=r[2], precio=r[4], disp=r[8];
    if(!nombre) continue;
    if(disp && disp.trim()==='Disponible' && precio!=='55555555'){
      out.push({nombre, torre, precio:parseFloat(precio)||null});
    }
  }
  return out;
}

async function buildInventory(){
  const all = [];
  for(const t of TORRES){
    try{ const units = await fetchMappenTorre(t); all.push(...units); }
    catch(e){ console.error('Mappen fetch falló para torre', t, e); }
  }
  const built = [];
  for(const u of all){
    const key = normName(u.nombre);
    const ut = UNIT_TIPO[key];
    let tip = null;
    if(ut){ tip = TYPOLOGY[`${ut.torre}|${normName(ut.tipo)}`]; }
    built.push({
      nombre: u.nombre,
      torre: u.torre,
      m2_int: tip ? tip.m2i : null,
      rec: tip ? tip.rec : null,
      banos: tip ? tip.banos : null,
      extra: tip ? (tip.ext || 'NA') : 'NA',
      precio: u.precio,
      delivery: DELIVERY_MAP[u.torre] || '?'
    });
  }
  return built;
}

async function fetchBankRate(){
  try{
    const {data, error} = await supa.from('config').select('value').eq('key','params_financieros').single();
    if(error || !data) return;
    const params = typeof data.value === 'string' ? JSON.parse(data.value) : data.value;
    const rate = params.tasa_bx || params.tasa_bbva;
    if(rate) BANK_RATE_ANNUAL = rate > 1 ? rate/100 : rate;
  }catch(e){ console.warn('No se pudo leer tasa de Supabase, usando fallback', e); }
}

function computeBudgetCeiling(enganche, mensualidad){
  const r = BANK_RATE_ANNUAL/12;
  const n = LOAN_TERM_MONTHS;
  const maxFinanciado = mensualidad * (1-Math.pow(1+r,-n)) / r;
  return Math.round(enganche + maxFinanciado);
}

function filterAndCapInventory(inventory, presupuesto){
  const withPrice = inventory.filter(u=>u.precio);
  const dentro = withPrice.filter(u=>u.precio <= presupuesto*1.15);
  const pool = dentro.length >= 10 ? dentro : withPrice.sort((a,b)=>a.precio-b.precio);
  return pool.sort((a,b)=>Math.abs(a.precio-presupuesto)-Math.abs(b.precio-presupuesto)).slice(0,60);
}

  try{
    await fetch(`${BACKEND_URL}/api/zoho/note`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({recordId:zohoId, module:zohoModule, content:notaTexto})
    });
  }catch(e){ console.warn('No se pudo guardar nota en Zoho', e); }
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
const app = document.getElementById('app');

function progressBar(){
  const total = screens.filter(s=>!['loading','results'].includes(s)).length;
  let html = '<div class="progress">';
  for(let i=0;i<total;i++){
    html += `<span class="${i<screenIndex?'done':''}"><i></i></span>`;
  }
  return html + '</div>';
}

function render(){
  const screen = screens[screenIndex];
  app.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.display='flex'; wrap.style.flexDirection='column'; wrap.style.flex='1';

  if(screen!=='loading' && screen!=='results') wrap.innerHTML += progressBar();

  if(screen==='nicho') wrap.innerHTML += renderNicho();
  else if(screen==='nicho_sub') wrap.innerHTML += renderNichoSub();
  else if(screen==='nicho_freetext') wrap.innerHTML += renderNichoFreeText();
  else if(screen==='timing') wrap.innerHTML += renderChoiceScreen('¿Para cuándo te gustaría mudarte?','', TIMING_OPTS, 'timing');
  else if(screen==='espacio') wrap.innerHTML += renderChoiceScreen('¿Qué tan importante es tener un espacio exterior?','Balcón, terraza, roof garden o jardín', ESPACIO_OPTS, 'espacio');
  else if(screen==='enganche') wrap.innerHTML += renderChoiceScreen('¿Cuánto tienes disponible para el enganche hoy?','', ENGANCHE_OPTS.map(o=>o.label), 'enganche_label');
  else if(screen==='mensualidad') wrap.innerHTML += renderMensualidad();
  else if(screen==='prioridad') wrap.innerHTML += renderPrioridad();
  else if(screen==='prioridad_sub') wrap.innerHTML += renderPrioridadSub();
  else if(screen==='loading'){ wrap.innerHTML += renderLoading(); app.appendChild(wrap); runRecommendation(); return; }
  else if(screen==='results') wrap.innerHTML += renderResults();

  app.appendChild(wrap);
  attachHandlers(screen);
}

function renderNicho(){
  return `
    <div class="eyebrow">Antes que nada</div>
    <h1>¿Qué te trae a buscar un nuevo hogar?</h1>
    <div class="sub">Elige la que más se parezca a tu situación — de ahí partimos.</div>
    <div class="options">
      ${NICHOS.map(n=>`<button class="opt" data-nicho="${n.id}">${n.label}</button>`).join('')}
    </div>`;
}

function renderNichoSub(){
  const nicho = NICHOS.find(n=>n.id===answers.nicho);
  return `
    <h1>${nicho.sub.q}</h1>
    <div class="sub"></div>
    <div class="options">
      ${nicho.sub.opts.map(o=>`<button class="opt" data-sub="${o}">${o}</button>`).join('')}
    </div>`;
}

function renderNichoFreeText(){
  return `
    <h1>Cuéntanos con tus palabras</h1>
    <div class="sub">Lo que nos digas nos ayuda a entender mejor qué buscas.</div>
    <textarea id="freeTextInput" placeholder="Escribe aquí..."></textarea>
    <div class="nav">
      <button class="btn-text" onclick="goBack()">Atrás</button>
      <button class="btn btn-primary" id="freeTextNext">Continuar</button>
    </div>`;
}

function renderChoiceScreen(title, sub, opts, field){
  return `
    <h1>${title}</h1>
    <div class="sub">${sub}</div>
    <div class="options">
      ${opts.map(o=>`<button class="opt" data-field="${field}" data-value="${o}">${o}</button>`).join('')}
    </div>
    <div class="nav"><button class="btn-text" onclick="goBack()">Atrás</button></div>`;
}

function renderMensualidad(){
  return `
    <h1>¿Con qué mensualidad te sentirías cómodo?</h1>
    <div class="sub"></div>
    <div class="options">
      ${MENSUALIDAD_OPTS.map(o=>`<button class="opt" data-field="mensualidad_label" data-value="${o.label}">${o.label}</button>`).join('')}
      <button class="opt" data-field="mensualidad_label" data-value="No estoy seguro, ayúdenme a calcularlo">No estoy seguro, ayúdenme a calcularlo</button>
    </div>
    <div class="nav"><button class="btn-text" onclick="goBack()">Atrás</button></div>`;
}

function renderPrioridad(){
  return `
    <h1>Si solo pudieras quedarte con una cosa, ¿cuál sería?</h1>
    <div class="sub"></div>
    <div class="opt-grid">
      ${PRIORIDADES.map(p=>`<button class="opt" data-prioridad="${p.id}">${p.label}</button>`).join('')}
    </div>
    <div class="nav"><button class="btn-text" onclick="goBack()">Atrás</button></div>`;
}

function renderPrioridadSub(){
  const pr = PRIORIDADES.find(p=>p.id===answers.prioridad);
  return `
    <h1>${pr.sub.q}</h1>
    <div class="sub"></div>
    <div class="options">
      ${pr.sub.opts.map(o=>`<button class="opt" data-subpr="${o}">${o}</button>`).join('')}
    </div>`;
}

function renderLoading(){
  return `<div class="loading"><div class="spinner"></div><div>Buscando las mejores opciones para ti...</div></div>`;
}

let lastRecommendation = null;
function renderResults(){
  const rec = lastRecommendation;
  if(!rec) return `<div class="honest-msg">Hubo un problema generando tu recomendación. Pide ayuda a tu asesor.</div>`;
  let html = '';
  if(rec.honest_fit === false){
    html += `<h1>Encontramos algo cercano</h1><div class="honest-msg">${rec.fit_message||''}</div>`;
  } else {
    html += `<div class="eyebrow">Para ti</div><h1>Estas son tus mejores opciones</h1>`;
  }
  (rec.recommendations||[]).forEach(u=>{
    html += `
      <div class="card">
        <span class="torre-tag">Torre ${u.torre} · ${u.delivery||''}</span>
        <h3>${u.unit_name}</h3>
        <div class="specs">${u.m2_total||u.m2_int||'?'} m² · ${u.bedrooms||'?'} rec · ${u.bathrooms||'?'} baños${u.ext_type && u.ext_type!=='NA' ? ' · '+u.ext_type : ''}</div>
        <div class="precio">$${(u.list_price||0).toLocaleString('es-MX')}</div>
        <div class="justif">${u.justification||''}</div>
      </div>`;
  });
  if(rec.positioning_fact){
    html += `<div class="positioning">${rec.positioning_fact}</div>`;
  }
  const esInversion = ['b','d'].includes(answers.nicho);
  html += `
    <div class="bifurcacion">
      <a class="${esInversion?'bif-invest':'bif-live'}" href="https://aliah-comercial.github.io/simulador/" target="_blank">Ver simulador de inversión</a>
      <a class="${!esInversion?'bif-invest':'bif-live'}" href="#" target="_blank">Ver precios y planes</a>
    </div>`;
  if(rec.advisor_insight){
    html += `<div class="advisor-note"><b>Nota para el asesor:</b> ${rec.advisor_insight}</div>`;
  }
  return html;
}

// ═══════════════════════════════════════════════════════════
// HANDLERS
// ═══════════════════════════════════════════════════════════
function attachHandlers(screen){
  app.querySelectorAll('[data-nicho]').forEach(b=>b.onclick=()=>{ answers.nicho=b.dataset.nicho; goNext(); });
  app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{ answers.nicho_detalle=b.dataset.sub; goNext(); });
  app.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{ answers[b.dataset.field]=b.dataset.value; goNext(); });
  app.querySelectorAll('[data-prioridad]').forEach(b=>b.onclick=()=>{ answers.prioridad=b.dataset.prioridad; goNext(); });
  app.querySelectorAll('[data-subpr]').forEach(b=>b.onclick=()=>{ answers.prioridad_detalle=b.dataset.subpr; goNext(); });
  const ftBtn = document.getElementById('freeTextNext');
  if(ftBtn) ftBtn.onclick=()=>{ answers.freeText = document.getElementById('freeTextInput').value; goNext(); };
}

async function runRecommendation(){
  await fetchBankRate();
  const enganche = ENGANCHE_OPTS.find(o=>o.label===answers.enganche_label)?.val || 1100000;
  let mensualidad;
  const sinSeguro = answers.mensualidad_label === 'No estoy seguro, ayúdenme a calcularlo';
  if(sinSeguro){ mensualidad = 55000; } // valor medio conservador cuando el cliente no sabe
  else { mensualidad = MENSUALIDAD_OPTS.find(o=>o.label===answers.mensualidad_label)?.val || 55000; }
  const presupuesto = computeBudgetCeiling(enganche, mensualidad);

  const nicho = NICHOS.find(n=>n.id===answers.nicho);
  const profile = {
    nicho: answers.nicho,
    nicho_label: nicho ? nicho.label : '',
    nicho_detalle: answers.nicho_detalle || null,
    timing: answers.timing,
    espacio: answers.espacio,
    presupuesto_estimado: presupuesto,
    presupuesto_no_seguro: sinSeguro,
    prioridad: answers.prioridad,
    prioridad_detalle: answers.prioridad_detalle || null,
    freeText: answers.freeText || null
  };

  try{
    const inventoryFull = await buildInventory();
    const inventory = filterAndCapInventory(inventoryFull, presupuesto);
    const rec = await callRecommend(profile, inventory);
    lastRecommendation = rec;
    await logSession(profile, rec);
    await saveToZohoIfPresent(profile, rec);
  }catch(e){
    console.error('Error generando recomendación', e);
    lastRecommendation = {honest_fit:false, fit_message:'Hubo un problema técnico. Tu asesor puede ayudarte directamente.', recommendations:[]};
  }
  screenIndex++;
  render();
}

render();
</script>
